name: Bug report
description: Something in the panel or the effect-pinning scripts misbehaves
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Security problems should go through
        [private vulnerability reporting](../../security/advisories/new) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Output of `omarchy version`, and your plugin commit (`git -C ~/.config/omarchy/plugins/brianirish.screensaver log -1 --oneline`).
      render: text
    validations:
      required: true
  - type: dropdown
    id: override
    attributes:
      label: Which effect-pinning scripts are installed?
      options:
        - "Both — /usr/local/bin/omarchy-screensaver and omarchy-launch-screensaver, plus the PATH block"
        - "Only /usr/local/bin/omarchy-screensaver (as 1.x had it), plus the PATH block"
        - "None — plugin only"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: "QML/shell output helps: `journalctl --user --since '10 minutes ago' | grep -i -e qml -e screensaver`"
      render: text
