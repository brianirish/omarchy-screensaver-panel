name: Sync upstream

# Daily, against the newest Omarchy release (not its development branch):
# three-way merge the release's stock omarchy-screensaver onto
# extras/omarchy-screensaver, re-sync the effect list in Model.js and
# i18n/en.json with the effects both the ttfx package and the native
# screensaver's bundled ttfx have, and watch the stock
# omarchy-launch-screensaver that extras/omarchy-launch-screensaver wraps. An
# override re-sync or an effect change is committed to main and released. A
# merge conflict, a launcher change, a release without the terminal
# screensaver, or upstream moving something the sync reads is not something a
# bot should settle, so those open an issue instead.
#
# Pushes made with the workflow token do not trigger ci.yml, which is why
# scripts/check runs here before anything is committed.

on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Sync with upstream
        id: sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/sync-upstream --out-dir "$RUNNER_TEMP/sync"

      - name: Check
        if: steps.sync.outputs.changed == 'true'
        run: scripts/check

      - name: Commit and push
        if: steps.sync.outputs.changed == 'true'
        env:
          MESSAGE_FILE: ${{ steps.sync.outputs.message_file }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --file "$MESSAGE_FILE"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Tag and release
        if: steps.sync.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.sync.outputs.tag }}
          NOTES_FILE: ${{ steps.sync.outputs.notes_file }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --notes-file "$NOTES_FILE"

      - name: Open an issue for what needs a human
        if: steps.sync.outputs.attention == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.sync.outputs.attention_title }}
          REPORT_FILE: ${{ steps.sync.outputs.attention_file }}
        run: |
          gh label create upstream-sync --color d93f0b --force \
            --description "An upstream change the sync workflow could not apply"
          existing=$(gh issue list --label upstream-sync --state open --json number,title \
            --jq '.[] | select(.title == env.TITLE) | .number' | head -n1)
          if [[ -n $existing ]]; then
            echo "Already tracked in #$existing; not filing another."
          else
            gh issue create --label upstream-sync --title "$TITLE" --body-file "$REPORT_FILE"
          fi
